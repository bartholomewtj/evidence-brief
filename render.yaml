# Render Blueprint — declares the backend so it can be created in one click
# rather than a dozen dashboard fields.
#
# In Render: New → Blueprint → pick this repo. It reads this file, builds the
# Dockerfile, and wires the environment up as described here.
#
# Deploys happen automatically on push to the default branch; there is no
# workflow and no token for GitHub to hold.

services:
  - type: web
    # This becomes the subdomain: <name>.onrender.com, which is global, so a
    # plain "articlegen" is likely taken. Keep this in step with API_BASE in
    # index.html — if Render makes you pick a different name, change both.
    name: articlegen-api
    runtime: docker
    plan: free
    # The branch Render builds from, recorded here so the coupling is visible in
    # the repo rather than living only in the dashboard — which is what made
    # renaming the default branch risky in the first place (#47).
    #
    # Editing this line alone does not move Render: Blueprint auto-sync is off,
    # measured. Render followed GitHub's branch rename on its own. Verify with
    # `curl .../api/health`, which reports the branch and commit the running
    # service was actually built from.
    branch: main
    # Closest free region to the Gold Coast. Oregon/Frankfurt are the
    # alternatives if Singapore is ever unavailable.
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render assigns the port and expects the app to bind it. The Dockerfile's
      # CMD already reads ${PORT}, so this just makes the contract explicit.
      - key: PORT
        value: "10000"

      # Never write articles to disk on a shared host: one visitor's article
      # would be readable by every other visitor at a guessable URL.
      - key: ARTICLEGEN_STATELESS
        value: "1"

      # Only the GitHub Pages front end may call this from a browser.
      - key: ARTICLEGEN_ALLOWED_ORIGINS
        value: https://bartholomewtj.github.io

      # Per-IP requests/hour. Callers pay for their own LLM tokens, but the
      # scholarly APIs meter against this server's address.
      - key: ARTICLEGEN_RATE_LIMIT
        value: "20"

      # Identifies us to OpenAlex's "polite pool" for better rate limits.
      # Set a real address in the Render dashboard if you want the benefit.
      - key: OPENALEX_MAILTO
        sync: false

      # Required by the `paperfetch-oa` package installed in the Dockerfile
      # (#173) for its Unpaywall lookups. Without it, `papers get` refuses
      # every uncached DOI and full text falls back to Europe PMC — a soft
      # failure, not a crash. Set a real address in the Render dashboard.
      - key: PAPERS_MAILTO
        sync: false

      # Same names as local paperfetch / articlegen CLI. Set in the Render
      # dashboard as secrets — never commit them. Absent: Semantic Scholar
      # search is keyless (often 429s); NCBI / CORE steps in papers are
      # skipped or rate-limited. Do not set LIBKEY_API_KEY here (CKN-only).
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: CORE_API_KEY
        sync: false

      # Host-paid public drafts (GPT-5.6 Luna). Set the value in the Render
      # dashboard as a secret — never commit it. Absent: generate returns 400.
      # The web app does not take a visitor key. Rate limits are the spend
      # cap. Hosted generation is forced to Luna; a crafted POST cannot
      # select Opus on this bill.
      - key: ARTICLEGEN_PUBLIC_OPENROUTER_KEY
        sync: false

      # Public gallery (gist scope only — not repo contents).
      # Set in the Render dashboard. Absent: generated briefings are not listed.
      - key: ARTICLEGEN_GALLERY_TOKEN
        sync: false

      # Optional run log. Set to the id of a *secret* gist you created with
      # `gh gist create --secret runs.jsonl`; run lines are appended there so
      # they survive a restart. Uses ARTICLEGEN_GALLERY_TOKEN (gist scope).
      # Unset: run lines still go to stderr, and only there.
      - key: ARTICLEGEN_ANALYTICS_GIST
        sync: false
