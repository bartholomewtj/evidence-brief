[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "articlegen"
version = "0.1.0"
description = "Sourced evidence briefings from a question. Every statistic is checked against the cited papers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.117",
    "requests>=2.31",
]

[project.optional-dependencies]
# Opt-in TypeSafe Jev features (ARTICLEGEN_JEV / --jev). Nothing imports it otherwise.
jev = ["typesafe-sdk>=0.6"]

[project.scripts]
articlegen = "articlegen.cli:main"

[tool.setuptools]
packages = ["articlegen"]
